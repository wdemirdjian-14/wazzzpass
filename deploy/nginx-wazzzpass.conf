# /etc/nginx/sites-available/wazzzpass — site STATIQUE (aucun processus applicatif, aucun port).
# Installé par deploy/installer-serveur.sh ; HTTPS ajouté ensuite par : certbot --nginx -d wazzzpass.walautao.fr
#
# Le serveur ne fait que servir les fichiers de la version en ligne. Le chiffrement et le
# déchiffrement ont lieu dans le navigateur : aucun mot de passe ne transite ni n'est stocké ici.

server {
    listen 80;
    listen [::]:80;
    server_name wazzzpass.walautao.fr;

    root /var/www/wazzzpass-deploy/current/dist;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1k;      # le site ne reçoit jamais de données
    access_log /var/log/nginx/wazzzpass.access.log;
    error_log  /var/log/nginx/wazzzpass.error.log warn;

    # --- En-têtes de sécurité (repris dans chaque location : nginx n'hérite pas des add_header) ---
    set $csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src https://api.dropboxapi.com https://content.dropboxapi.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";

    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Seules les méthodes de lecture sont acceptées
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Fichiers cachés (.release, .git…) : jamais servis
    location ~ /\. { deny all; return 404; }

    # Fichiers versionnés par Vite (nom avec empreinte) : cache long
    location /assets/ {
        expires 1y;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Page de l'application : toujours revalidée, pour recevoir immédiatement une nouvelle version
    location / {
        expires -1;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
